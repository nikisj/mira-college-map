<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mira｜2027 美本选校地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#25342f;background:#f5f6f5;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{background:#fff;padding:28px 36px 22px;border-bottom:1px solid #e1e6e3}.heading{display:flex;justify-content:space-between;align-items:center;gap:24px}h1{font-size:26px;letter-spacing:-.7px;margin:0 0 8px;font-weight:650}.subtitle{margin:0;color:#76817b;font-size:13px}.stats{display:flex;gap:30px;flex-shrink:0}.stat{display:flex;flex-direction:column;gap:5px}.stat strong{font-size:23px;font-weight:600}.stat span{font-size:11px;color:#79837f;letter-spacing:.6px}.question{margin:22px 0 0;padding-left:13px;border-left:3px solid #739389;color:#52635b;font-size:14px;line-height:1.7}main{display:grid;grid-template-columns:30% 70%;height:calc(100dvh - 179px);min-height:520px;padding:20px 24px 24px;gap:0}.sidebar{background:white;border:1px solid #dde4df;border-radius:12px 0 0 12px;min-width:0;display:flex;flex-direction:column;overflow:hidden}.controls{padding:20px 18px 14px;border-bottom:1px solid #e7ebe8}.section-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}h2{margin:0;font-size:15px;font-weight:600}.reset{background:none;border:0;color:#40685a;font-size:12px;padding:5px 0 5px 12px}.reset:hover{text-decoration:underline}input,select{width:100%;border:1px solid #dce3de;border-radius:6px;background:#fafbf9;color:#34463d;min-height:39px;font-size:13px;padding:9px 11px}input{margin-bottom:9px}input::placeholder{color:#8b958f}input:focus,select:focus,button:focus-visible{outline:2px solid #527c6c;outline-offset:2px}.count{font-size:11px;color:#818b84;margin:13px 0 0}.school-list{overflow:auto;flex:1;padding:6px 8px 12px;scrollbar-width:thin}.school{display:block;position:relative;text-align:left;background:#fff;border:1px solid transparent;width:100%;border-radius:7px;padding:13px 10px 13px 29px;color:#263a30;margin:2px 0}.school:hover{background:#f5f7f5}.school.selected{background:#edf3ef;border-color:#cfddd4}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}.school>.dot{position:absolute;left:11px;top:19px}.school strong{display:block;font-size:14px;font-weight:600;line-height:1.5}.school .english{display:block;font-size:12px;line-height:1.5;margin-top:3px;color:#596c61;overflow-wrap:anywhere}.school .place{display:block;font-size:11px;color:#8a948e;margin-top:4px}.empty{padding:25px 14px;font-size:13px;color:#758077;line-height:1.8}.map-panel{position:relative;min-width:0;display:flex;flex-direction:column;border:1px solid #dde4df;border-left:0;border-radius:0 12px 12px 0;overflow:hidden;background:#f0f3ef}.map-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;padding:15px 20px;border-bottom:1px solid #e4e9e5}.map-heading span{font-size:11px;color:#8a938d}#map{flex:1;min-height:300px;background:#e9eeea}.legend{display:flex;flex-wrap:wrap;gap:10px 20px;padding:12px 18px;background:white;border-top:1px solid #e3e8e4}.legend-item{display:flex;align-items:center;gap:7px;font-size:11px;color:#66766c;line-height:1.5}.pin-wrap{background:none;border:0}.pin{width:26px;height:26px;border:2px solid white;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 5px #203a3a40;display:flex;align-items:center;justify-content:center}.pin span{transform:rotate(45deg);color:#fff;font-size:10px;font-weight:700}.leaflet-popup-content{font-family:inherit;line-height:1.6;margin:17px 20px;min-width:180px}.popup-cn{font-size:16px;font-weight:650;margin-bottom:4px}.popup-en{font-size:12px;color:#4d6257}.popup-place{font-size:12px;color:#7b877f;margin:7px 0 11px}.popup-type{font-size:12px;border-top:1px solid #e6eae7;padding-top:10px}.popup-type small{display:block;color:#7b877f;font-size:10px;margin-top:3px}.map-error{padding:30px;color:#53675c;font-size:14px;line-height:1.8}.leaflet-control-attribution{font-size:10px!important}
@media(min-width:1500px){main{grid-template-columns:27% 73%}header{padding-left:44px;padding-right:44px}}
@media(max-width:850px){header{padding:22px 20px}.heading{align-items:flex-start;gap:18px;flex-direction:column}.stats{gap:28px}.stat{flex-direction:row;align-items:baseline;gap:7px}.stat strong{font-size:19px}.question{margin-top:17px;font-size:13px}main{height:auto;min-height:0;grid-template-columns:minmax(0,1fr);padding:14px;gap:14px}.sidebar{border-radius:10px;max-height:390px}.controls{padding:15px}.school-list{min-height:140px}.map-panel{border:1px solid #dde4df;border-radius:10px;height:530px}#map{min-height:320px}.legend{gap:8px 15px;padding:12px}.map-heading{padding:13px 15px}h1{font-size:23px}.map-heading span{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="heading"><div><h1>Mira｜2027 美本选校地图</h1><p class="subtitle" id="subtitle"></p></div><div class="stats" aria-label="学校池统计"><div class="stat"><strong id="school-total"></strong><span>Schools</span></div><div class="stat"><strong id="state-total"></strong><span id="state-label"></span></div><div class="stat"><strong id="type-total"></strong><span>School Types</span></div></div></div><p class="question">如果完全不考虑录取难度，我愿不愿意在这里生活、学习、交朋友、成长四年？</p></header>
<main><aside class="sidebar" aria-label="学校列表"><div class="controls"><div class="section-heading"><h2>学校研究池</h2><button class="reset" id="reset" type="button">显示全部</button></div><input id="search" type="search" placeholder="搜索中文名、英文名或城市" aria-label="搜索学校" autocomplete="off"><select id="type-filter" aria-label="学校类型筛选"></select><p class="count" id="result-count" aria-live="polite"></p></div><div class="school-list" id="school-list"></div></aside><section class="map-panel" aria-label="美国选校地图"><div class="map-heading"><h2>学校分布</h2><span>点击学校，探索它的位置</span></div><div id="map" aria-label="学校位置交互地图"></div><div class="legend" id="legend" aria-label="学校类型图例"></div></section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
// 学校数据是唯一的数据入口。可直接新增、删除学校或添加未来使用的字段。
const schools = [

{ name:"University of Richmond", cnName:"里士满大学", city:"Richmond", state:"Virginia", type:"A", lat:37.5751, lng:-77.5407 },

{ name:"Macalester College", cnName:"麦卡莱斯特学院", city:"Saint Paul", state:"Minnesota", type:"A", lat:44.9394, lng:-93.1698 },

{ name:"Denison University", cnName:"丹尼森大学", city:"Granville", state:"Ohio", type:"A", lat:40.0725, lng:-82.5227 },

{ name:"Dickinson College", cnName:"狄金森学院", city:"Carlisle", state:"Pennsylvania", type:"A", lat:40.2023, lng:-77.1975 },

{ name:"College of Wooster", cnName:"伍斯特学院", city:"Wooster", state:"Ohio", type:"A", lat:40.8117, lng:-81.9351 },

{ name:"St. Olaf College", cnName:"圣奥拉夫学院", city:"Northfield", state:"Minnesota", type:"A", lat:44.4583, lng:-93.1849 },

{ name:"Oberlin College", cnName:"欧柏林学院", city:"Oberlin", state:"Ohio", type:"A", lat:41.2939, lng:-82.2174 },

{ name:"University of Rochester", cnName:"罗切斯特大学", city:"Rochester", state:"New York", type:"B", lat:43.1292, lng:-77.6280 },

{ name:"Brandeis University", cnName:"布兰迪斯大学", city:"Waltham", state:"Massachusetts", type:"B", lat:42.3657, lng:-71.2584 },

{ name:"William & Mary", cnName:"威廉玛丽大学", city:"Williamsburg", state:"Virginia", type:"B", lat:37.2710, lng:-76.7138 },

{ name:"Wake Forest University", cnName:"维克森林大学", city:"Winston-Salem", state:"North Carolina", type:"B", lat:36.1341, lng:-80.2783 },

{ name:"Clark University", cnName:"克拉克大学", city:"Worcester", state:"Massachusetts", type:"B", lat:42.2515, lng:-71.8233 },

{ name:"Lehigh University", cnName:"理海大学", city:"Bethlehem", state:"Pennsylvania", type:"C", lat:40.6079, lng:-75.3783 },

{ name:"Syracuse University", cnName:"雪城大学", city:"Syracuse", state:"New York", type:"C", lat:43.0392, lng:-76.1351 },

{ name:"University of Denver", cnName:"丹佛大学", city:"Denver", state:"Colorado", type:"C", lat:39.6781, lng:-104.9618 },

{ name:"University of Pittsburgh", cnName:"匹兹堡大学", city:"Pittsburgh", state:"Pennsylvania", type:"D", lat:40.4443, lng:-79.9608 },

{ name:"University of Massachusetts Amherst", cnName:"马萨诸塞大学阿默斯特分校", city:"Amherst", state:"Massachusetts", type:"D", lat:42.3868, lng:-72.5301 },

{ name:"University of Wisconsin–Madison", cnName:"威斯康星大学麦迪逊分校", city:"Madison", state:"Wisconsin", type:"D", lat:43.0766, lng:-89.4125 },

{ name:"American University", cnName:"美利坚大学", city:"Washington", state:"District of Columbia", type:"E", lat:38.9379, lng:-77.0901 },

{ name:"George Washington University", cnName:"乔治华盛顿大学", city:"Washington", state:"District of Columbia", type:"E", lat:38.8997, lng:-77.0486 }

];
const schoolTypes = {
 A: {label:'关系密集型本科环境', en:'Relationship-intensive undergraduate', color:'#4d7d6d'},
 B: {label:'导师＋研究探索型', en:'Advising & research exploration', color:'#557c9d'},
 C: {label:'项目／职业探索型', en:'Project & career-oriented', color:'#b1874b'},
 D: {label:'大型研究／旗舰大学', en:'Large research / flagship', color:'#87729d'},
 E: {label:'城市嵌入型', en:'Urban-embedded', color:'#b76f68'}
};
const byId = id => document.getElementById(id);
const typeKeys = [...new Set(schools.map(s => s.type))].sort();
const typeInfo = key => schoolTypes[key] || {label:key,en:'',color:'#6b7b72'};
const states = new Set(schools.map(s => s.state));
const hasDC = states.delete('District of Columbia');
byId('subtitle').textContent = `当前阶段性研究池：${schools.length}所`;
byId('school-total').textContent = schools.length;
byId('state-total').textContent = states.size;
byId('state-label').textContent = hasDC ? 'States + DC' : 'States';
byId('type-total').textContent = typeKeys.length;
byId('type-filter').add(new Option('全部学校类型', ''));
for (const key of typeKeys) {
 const info = typeInfo(key);
 byId('type-filter').add(new Option(`${key}｜${info.label}`, key));
 const item = document.createElement('span'); item.className='legend-item';
 const dot = document.createElement('span'); dot.className='dot'; dot.style.background=info.color;
 item.append(dot, document.createTextNode(`${key} ${info.label}`)); byId('legend').append(item);
}
let map = null, markerLayer = null, selectedIndex = null;
const markers = new Map();
let pendingPopup = null;
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (window.L) {
 map = L.map('map', {scrollWheelZoom:true}).setView([39,-96],4);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
 }).addTo(map);
 markerLayer = L.layerGroup().addTo(map);
 new ResizeObserver(() => map.invalidateSize({pan:false})).observe(byId('map'));
} else {
 byId('map').className='map-error';
 byId('map').textContent='地图未能加载。请连接网络后刷新页面，以加载地图组件与底图。学校列表和筛选仍可使用。';
}
function textElement(tag, className, text) {
 const element = document.createElement(tag); element.className=className; element.textContent=text; return element;
}
function makePopup(school) {
 const info=typeInfo(school.type), popup=document.createElement('div');
 popup.append(textElement('div','popup-cn',school.cnName),textElement('div','popup-en',school.name),textElement('div','popup-place',`${school.city}, ${school.state}`));
 const type=textElement('div','popup-type',`${school.type}｜${info.label}`); type.style.color=info.color;
 type.append(textElement('small','',info.en)); popup.append(type); return popup;
}
function highlight(index, scroll) {
 selectedIndex=index;
 for (const button of byId('school-list').querySelectorAll('.school')) {
  const active=Number(button.dataset.index)===index;
  button.classList.toggle('selected',active); button.setAttribute('aria-pressed',String(active));
  if (active && scroll) {
   const list=byId('school-list');
   list.scrollTo({top:list.scrollTop+button.getBoundingClientRect().top-list.getBoundingClientRect().top-(list.clientHeight-button.offsetHeight)/2,behavior:reducedMotion?'instant':'smooth'});
  }
 }
}
function selectSchool(index) {
 highlight(index,false);
 if (!map) return;
 const marker=markers.get(index); if (!marker) return;
 if (pendingPopup) { map.off('moveend',pendingPopup); pendingPopup=null; }
 map.stop();
 if (window.matchMedia('(max-width:850px)').matches) byId('map').scrollIntoView({behavior:reducedMotion?'instant':'smooth',block:'center'});
 pendingPopup = () => { marker.openPopup(); pendingPopup=null; };
 map.once('moveend',pendingPopup);
 map.flyTo(marker.getLatLng(),11,{animate:!reducedMotion,duration:.85});
}
function render() {
 const query=byId('search').value.trim().toLocaleLowerCase();
 const type=byId('type-filter').value;
 const visible=schools.map((school,index)=>({school,index})).filter(({school:s})=>(!type||s.type===type)&&(!query||[s.cnName,s.name,s.city,s.state].some(value=>value.toLocaleLowerCase().includes(query))));
 if(map){if(pendingPopup){map.off('moveend',pendingPopup);pendingPopup=null;}map.stop();map.closePopup();markerLayer.clearLayers();} markers.clear();
 if (!visible.some(item=>item.index===selectedIndex)) selectedIndex=null;
 byId('school-list').replaceChildren();
 byId('result-count').textContent=`显示 ${visible.length} / ${schools.length} 所学校`;
 for (const {school:s,index} of visible) {
  const info=typeInfo(s.type), button=document.createElement('button');
  button.type='button';button.className='school';button.dataset.index=index;
  const dot=document.createElement('span');dot.className='dot';dot.style.background=info.color;
  button.append(dot,textElement('strong','',s.cnName),textElement('span','english',s.name),textElement('span','place',`${s.city}, ${s.state}`));
  button.addEventListener('click',()=>selectSchool(index));byId('school-list').append(button);
  if (map) {
   const pin=document.createElement('div');pin.className='pin';pin.style.background=info.color;pin.append(textElement('span','',s.type));
   const marker=L.marker([s.lat,s.lng],{title:s.cnName,alt:s.cnName,icon:L.divIcon({className:'pin-wrap',html:pin,iconSize:[28,36],iconAnchor:[13,32],popupAnchor:[0,-31]})}).bindPopup(makePopup(s),{maxWidth:280}).addTo(markerLayer);
   marker.on('click',()=>highlight(index,true)); markers.set(index,marker);
  }
 }
 highlight(selectedIndex,false);
 if (!visible.length) byId('school-list').append(textElement('p','empty','没有匹配的学校。试试其他关键词，或点击“显示全部”。'));
 if (map && visible.length) map.fitBounds(visible.map(({school:s})=>[s.lat,s.lng]),{padding:[45,45],maxZoom:10,animate:false});
}
byId('search').addEventListener('input',render);
byId('type-filter').addEventListener('change',render);
byId('reset').addEventListener('click',()=>{byId('search').value='';byId('type-filter').value='';selectedIndex=null;render();byId('school-list').scrollTop=0;});
render();
</script>
</body>
</html>
