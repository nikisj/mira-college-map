<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mira｜2027 美本选校工作台</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai&amp;display=swap&amp;text=%E6%84%BF%E4%BD%A0%E5%8E%BB%E4%B8%80%E4%B8%AA%E5%9C%B0%E6%96%B9%EF%BC%8C%E8%AE%A4%E8%AF%86%E4%B8%80%E4%BA%9B%E4%BA%BA%EF%BC%8C%E8%AF%BB%E4%B8%80%E4%BA%9B%E4%B9%A6%EF%BC%8C%E6%83%B3%E4%B8%80%E4%BA%9B%E9%97%AE%E9%A2%98%EF%BC%8C%E7%84%B6%E5%90%8E%E4%B8%8D%E6%96%AD%E6%88%90%E4%B8%BA%E8%87%AA%E5%B7%B1%E3%80%82">
<style>
:root{
 --bg:#f5f1e8;--paper:#fffdf8;--ink:#1f2a24;--muted:#6b746e;--faint:#9aa39d;
 --green:#2f5a45;--green-2:#46725b;--green-soft:#e7eee6;--amber-soft:#f6ecd6;
 --line:rgba(31,42,36,.10);--shadow:0 6px 24px rgba(31,42,36,.07);
 --r:18px;font-family:"Manrope",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
 color:var(--ink);background:var(--bg);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);display:flex;flex-direction:column;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green-2);outline-offset:2px}
[hidden]{display:none!important}
a{color:var(--green)}
.top{display:flex;align-items:center;gap:22px;padding:14px 28px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:900}
.brand{display:flex;align-items:baseline;gap:12px;flex:none}
.brand b{font-family:Georgia,"Times New Roman",serif;font-size:34px;letter-spacing:-.5px;color:var(--green)}
.brand span{font-size:13px;color:var(--muted);border-left:1px solid var(--line);padding-left:12px}
.quote{font-family:"LXGW WenKai",serif;font-size:clamp(14px,1.1vw,20px);color:var(--green);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs{display:flex;gap:6px;flex:none}
nav.tabs button,.menu-btn{border:0;background:transparent;padding:9px 14px;border-radius:999px;font-size:14px;color:var(--muted)}
nav.tabs button[aria-current="page"]{background:var(--green-soft);color:var(--green);font-weight:600}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;min-width:240px;display:flex;flex-direction:column;gap:4px}
.menu-pop button,.menu-pop label{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:10px;font-size:14px;cursor:pointer}
.menu-pop button:hover,.menu-pop label:hover{background:var(--green-soft)}
.menu-pop small{color:var(--muted);padding:4px 10px 6px;font-size:12px;line-height:1.5}
@media(max-width:1199px){.quote{display:none}}
@media(max-width:767px){.top{flex-wrap:wrap;padding:10px 16px;gap:8px}.brand b{font-size:28px}nav.tabs{order:3;width:100%;overflow-x:auto}}
main{flex:1;min-height:0}
.view{padding:22px 28px 40px}
@media(max-width:767px){.view{padding:16px}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--green-soft);color:var(--green);white-space:nowrap}
.tag.adm{background:#eef0f4;color:#3d4a5c}
.tag.watch{background:var(--amber-soft);color:#8a5d14}
.tag.adjusting{background:#f7e1d6;color:#8f3f17}
.tag.cold{background:#e4edf5;color:#2e5575}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:13px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.heart{border:0;background:transparent;font-size:19px;line-height:1;color:#cfd3cf;padding:4px}
.heart[aria-pressed="true"]{color:#c0584f}
.overview{display:grid;grid-template-columns:minmax(0,auto) 1px minmax(0,auto) 1px minmax(0,1fr);gap:28px;align-items:start;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--green);border-radius:var(--r);padding:20px 28px;margin-bottom:10px;box-shadow:var(--shadow)}
.overview .ov-item small{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;margin-bottom:6px}
.overview .ov-item b{display:block;font-weight:600;font-size:18px;line-height:1.4;color:var(--ink)}
.overview .ov-sep{align-self:stretch;background:var(--line)}
.overview .goal-note{display:block;margin-top:6px;font-size:14px;color:var(--green)}
@media(max-width:767px){.overview{grid-template-columns:1fr;gap:14px;padding:16px 18px}.overview .ov-sep{height:1px;align-self:auto}.overview .ov-item b{font-size:16px}}
.section-head{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.section-head h2{margin:0;font-size:19px}
.section-head span{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.card-top{display:flex;justify-content:space-between;gap:8px}
.card h3{margin:0;font-size:18px}
.card .en{font-size:13px;color:var(--muted)}
.card .meta{font-size:12px;color:var(--faint)}
.card p.head{margin:0;font-size:14px;line-height:1.65;color:#3a4540}
.card .actions{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.empty-note{color:var(--muted);font-size:14px;background:var(--paper);border:1px dashed var(--line);border-radius:var(--r);padding:18px}
details.fold{margin-top:22px}
details.fold summary{cursor:pointer;font-size:15px;color:var(--muted);padding:8px 0}
.sublabel{font-size:11px;color:var(--faint);letter-spacing:.04em}
.explore{display:grid;grid-template-columns:340px minmax(0,1fr) 470px;gap:16px;padding:16px 20px;height:calc(100dvh - 70px)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-height:0}
.side{display:flex;flex-direction:column;overflow:hidden}
.filters{padding:16px 16px 10px;border-bottom:1px solid var(--line);overflow:auto;max-height:52%}
.filters input[type=search]{width:100%;border:1px solid var(--line);border-radius:999px;padding:10px 14px;background:var(--bg)}
.fgroup{margin-top:12px}
.fgroup p{margin:0 0 6px;font-size:12px;color:var(--muted)}
.fgroup p em{font-style:normal;color:var(--faint)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:12px;color:var(--muted)}
.listbar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:13px;color:var(--muted)}
.listbar button{border:0;background:none;color:var(--green);font-size:13px}
.list{overflow:auto;flex:1}
.item{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:start;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.item:hover{background:#faf7ef}
.item[aria-selected="true"]{background:var(--green-soft);box-shadow:inset 3px 0 0 var(--green)}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;display:inline-block}
.item strong{display:block;font-size:15px}
.item .en{display:block;font-size:12px;color:var(--muted)}
.item .place{display:block;font-size:12px;color:var(--faint);margin-bottom:5px}
.mapwrap{position:relative;overflow:hidden}
#map{position:absolute;inset:0;border-radius:var(--r);background:#dfe6e3}
.map-modes{position:absolute;top:14px;left:54px;z-index:500;background:var(--paper);border-radius:999px;padding:4px;box-shadow:var(--shadow);display:flex}
.map-modes button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-size:13px}
.map-modes button[aria-pressed="true"]{background:var(--green);color:#fff}
.legend{position:absolute;left:14px;bottom:14px;z-index:500;background:var(--paper);border-radius:14px;padding:8px 12px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:10px;font-size:12px;max-width:calc(100% - 28px)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.map-msg{position:absolute;top:62px;left:54px;z-index:500;background:var(--paper);border-radius:10px;padding:6px 10px;font-size:12px;box-shadow:var(--shadow);margin:0}
.detail-col{overflow:auto}
.placeholder{padding:40px 28px;color:var(--muted);line-height:1.8}
.placeholder h2{color:var(--ink);font-size:20px;margin:0 0 6px}
@media(max-width:1199px){.explore{grid-template-columns:320px minmax(0,1fr)}.detail-col{display:none}}
.ftoggle,.pane-switch{display:none}
@media(max-width:767px){
 .explore{grid-template-columns:1fr;height:auto;padding:0 12px 12px}
 .pane-switch{display:flex;gap:6px;padding:12px 12px 10px;position:sticky;top:0;z-index:800;background:var(--bg)}
 .top{position:static}
 .pane-switch button{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px;font-size:14px}
 .pane-switch button[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
 .explore[data-pane="list"] .mapwrap,.explore[data-pane="map"] .side{display:none}
 .filters{max-height:none}
 .ftoggle{display:block;width:100%;margin-top:10px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 14px;font-size:14px;text-align:left}
 .filters:not(.open) .fmore{display:none}
 .list{max-height:none;overflow:visible}
 .mapwrap{height:calc(100dvh - 170px)}
 .drawer{width:100vw}
 .d{padding:14px 16px 28px}
 .d h2{font-size:24px}
 .hero{height:110px}
 .status-row{grid-template-columns:1fr;gap:6px}
 .status{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 12px}
 .status small{margin:0}
 .cards{grid-template-columns:1fr}
 table.cmp{min-width:520px}
 table.cmp tbody th{width:92px}
 table.cmp th,table.cmp td{padding:10px;font-size:13px}
 .cmp-pick select{min-width:0;flex:1 1 140px}
}
.backdrop{position:fixed;inset:0;background:rgba(20,28,24,.28);z-index:1000}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,94vw);background:var(--paper);z-index:1001;overflow:auto;box-shadow:-12px 0 40px rgba(0,0,0,.12)}
.drawer-close{position:sticky;top:12px;float:right;margin:12px 12px 0 0;z-index:3;border:0;background:rgba(255,255,255,.92);border-radius:50%;width:36px;height:36px;font-size:20px;box-shadow:var(--shadow)}
.d{padding:18px 22px 30px}
.hero{height:150px;border-radius:16px;background:linear-gradient(135deg,var(--green) 0%,#4c7a62 100%);position:relative;overflow:hidden;color:#fff;margin-bottom:16px}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .ghost{position:absolute;left:18px;top:16px;font-size:28px;opacity:.28;font-weight:600;letter-spacing:-.5px;white-space:nowrap}
.hero .place{position:absolute;left:18px;bottom:14px;font-size:13px;opacity:.9}
.hero .credit{position:absolute;right:10px;bottom:8px;font-size:10px;opacity:.8}
.d h2{margin:0;font-size:28px}
.d .en{color:var(--muted);margin:2px 0 6px}
.d .facts{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:12px}
.d .links{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.first{background:var(--green-soft);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.first p{margin:0;line-height:1.7}
.first .q{margin-top:8px;color:var(--green);font-weight:600}
.status-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.status{border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.status small{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.status b{font-size:14px;font-weight:600}
.dtabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
.dtabs button{border:0;background:none;padding:10px 10px;font-size:13px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}
.dtabs button[aria-selected="true"]{color:var(--green);border-bottom-color:var(--green);font-weight:600}
.block{border-radius:16px;padding:14px 16px;margin-bottom:10px;background:#f7f5ef}
.block.good{background:var(--green-soft)}
.block.warn{background:var(--amber-soft)}
.block h4{margin:0 0 6px;font-size:14px}
.block p{margin:0;font-size:14px;line-height:1.7}
.block .src{display:inline-block;margin-top:6px;font-size:12px}
.ev{font-size:11px;padding:2px 7px;border-radius:999px;margin-left:6px;font-weight:500;vertical-align:1px}
.ev.verified{background:var(--green);color:#fff}.ev.partial{background:var(--amber-soft);color:#8a5d14}.ev.none{background:#eceae4;color:var(--muted)}
.todo{color:var(--faint);font-style:normal}
table.kv{width:100%;border-collapse:collapse;font-size:14px}
table.kv td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.kv td:first-child{color:var(--muted);width:42%}
.mine-box{margin-top:18px;background:var(--green);color:#fff;border-radius:16px;padding:16px 18px}
.mine-box h4{margin:0 0 10px;font-size:15px}
.mine-box .chip{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.mine-box .chip[aria-pressed="true"]{background:#fff;color:var(--green)}
.mine-box input,.mine-box textarea{width:100%;border:0;border-radius:12px;padding:10px 12px;margin-top:10px;background:rgba(255,255,255,.95);color:var(--ink)}
.mine-box textarea{min-height:80px;resize:vertical}
.mine-box small{display:block;margin-top:8px;opacity:.75;font-size:12px}
.cmp-pick{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 18px}
.cmp-pick select{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--paper);min-width:220px}
.cmp-wrap{overflow-x:auto}
table.cmp{border-collapse:separate;border-spacing:0;width:100%;min-width:640px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table.cmp th,table.cmp td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);font-size:14px;line-height:1.6}
table.cmp thead th{background:var(--green-soft);font-size:15px}
table.cmp tbody th{color:var(--muted);font-weight:500;width:170px;background:#faf8f2}
.hint{color:var(--muted);font-size:13px}
.leaflet-tooltip{font-family:inherit}
@media(max-width:767px){
 .drawer{width:100vw}
 .d{padding:14px 16px 28px}
 .d h2{font-size:24px}
 .hero{height:110px}
 .status-row{grid-template-columns:1fr;gap:6px}
 .status{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 12px}
 .status small{margin:0}
 table.cmp{min-width:520px}
 table.cmp tbody th{width:92px}
 table.cmp th,table.cmp td{padding:10px;font-size:13px}
 .cmp-pick select{min-width:0;flex:1 1 140px}
}
.mine-map{position:relative;height:380px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);margin:14px 0 4px;background:#dfe6e3}
#mine-map-el{position:absolute;inset:0}
@media(max-width:767px){.mine-map{height:280px}}
</style>
</head>
<body>
<header class="top">
 <div class="brand"><b>Mira</b><span>2027 选校工作台</span></div>
 <div class="quote">愿你去一个地方，认识一些人，读一些书，想一些问题，然后不断成为自己。</div>
 <nav class="tabs" aria-label="主导航">
  <button data-view="mine">我的选校</button>
  <button data-view="us">美国看看</button>
  <button data-view="global">全球看看</button>
  <button data-view="compare">学校对比</button>
 </nav>
 <div class="menu">
  <button class="menu-btn" id="notes-btn" aria-haspopup="true" aria-expanded="false">我的笔记 ▾</button>
  <div class="menu-pop" id="notes-pop" hidden>
   <small>标记和笔记只保存在这台设备的浏览器里。换设备时先导出，再在另一台设备导入。</small>
   <button id="export-btn">导出我的笔记</button>
   <label>导入我的笔记<input type="file" id="import-file" accept="application/json" hidden></label>
  </div>
 </div>
</header>
<main>
 <section id="view-mine" class="view" hidden></section>
 <section id="view-explore" hidden>
  <div class="pane-switch" role="group" aria-label="显示方式"><button data-pane="list" aria-pressed="true">列表</button><button data-pane="map" aria-pressed="false">地图</button></div>
  <div class="explore" id="explore" data-pane="list">
   <aside class="panel side" aria-label="学校列表">
    <div class="filters" id="filters"></div>
    <div class="listbar"><span id="count"></span><button id="reset">清除筛选</button></div>
    <div class="list" id="list" role="listbox" aria-label="学校"></div>
   </aside>
   <section class="panel mapwrap" aria-label="地图">
    <div id="map"></div>
    <div class="map-modes" role="group" aria-label="地图模式">
     <button data-mode="standard" aria-pressed="true">标准</button>
     <button data-mode="chinese" aria-pressed="false">中文</button>
     <button data-mode="satellite" aria-pressed="false">卫星</button>
    </div>
    <p class="map-msg" id="map-msg" hidden></p>
    <div class="legend" id="legend"></div>
   </section>
   <aside class="panel detail-col" id="detail-col" aria-label="学校详情"></aside>
  </div>
 </section>
 <section id="view-compare" class="view" hidden></section>
</main>
<div class="backdrop" id="backdrop" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="学校详情"><button class="drawer-close" id="drawer-close" aria-label="关闭">×</button><div id="drawer-body"></div></aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="profile.js"></script>
<script src="schools.js"></script>
<script src="research.js"></script>
<script>
'use strict';
// MapTiler 公开浏览器密钥（已限制域名：nikisj.github.io）。
const MAPTILER_KEY = "mwBEpjq0pe4ry64fyVae";

const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids){
 const el=document.createElement(tag);
 if(attrs)for(const [k,v] of Object.entries(attrs)){
  if(v==null||v===false)continue;
  if(k==='class')el.className=v;
  else if(k==='text')el.textContent=v;
  else if(k==='value')el.value=v;
  else if(k==='checked')el.checked=!!v;
  else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
  else el.setAttribute(k,v===true?'':v);
 }
 for(const kid of kids.flat()){if(kid==null||kid===false)continue;el.append(kid.nodeType?kid:document.createTextNode(String(kid)));}
 return el;
}
const R = Object.fromEntries(research.map(r=>[r.id,r]));
const S = Object.fromEntries(schools.map(s=>[s.id,s]));
const firstSentence = t => { if(!t)return ''; const m=t.match(/^[^。！？]*[。！？]/); return m?m[0]:t; };

const LABEL = {
 status:{new:'新发现',priority:'优先研究',secondary:'第二优先',watch:'观察',climate:'因气候暂不考虑',none:'仅排名层'},
 statusColor:{new:'#b7822c',priority:'#2f5a45',secondary:'#7fa38c',watch:'#c0673a',climate:'#7a9bb8',none:'#b9bdb8'},
 region:{Northeast:'东北',South:'南部',Midwest:'中西部',West:'西部'},
 kind:{university:'综合大学',lac:'文理学院',specialized:'专业型大学'},
 size:{small:'小型',medium:'中型',large:'大型'},
 band:{1:'极冷',2:'很冷',3:'冷',4:'凉',5:'温和'},
 health:{stable:'稳定',watch:'需要观察',adjusting:'正在经历较大调整'},

/* personal data (local only) */
const KEY='mira-2027-v3', OLDKEY='mira-2027-college-preferences-v2';
let me={marks:{},compare:[]};
function save(){try{localStorage.setItem(KEY,JSON.stringify(me));return true;}catch(_){return false;}}

try{
 if(!Object.keys(me.marks).length){
  const old=JSON.parse(localStorage.getItem(OLDKEY)||'null');
  if(old&&typeof old==='object'){
   const map={'很想继续了解':'interested','需要更多了解':'continue','暂时无感':'notNow'};
   for(const [name,p] of Object.entries(old)){
    const s=schools.find(x=>x.name===name);if(!s||!p)continue;
    me.marks[s.id]={mark:map[p.miraChoice]||'',note:p.note||'',majorInterest:p.miraMajorInterest||'',updated:new Date().toISOString()};
   }
   save();
  }
 }
}catch(_){}
const markOf=id=>(me.marks[id]||{}).mark||'';

function passes(s){
 const r=R[s.id];
 if(!inScope(s))return false;
 if(!F.cold&&s.climate&&s.climate.outOfScope)return false;
 if(F.q){const q=F.q.toLowerCase();if(![s.cnName,s.name,s.city,s.state,s.country].some(v=>String(v||'').toLowerCase().includes(q)))return false;}
 if(F.group==='research'&&s.researchStatus==='none')return false;
 if(F.group==='priority'&&!['priority','secondary'].includes(s.researchStatus))return false;
 if(F.group==='watch'&&s.researchStatus!=='watch')return false;
 if(F.group==='none'&&s.researchStatus!=='none')return false;
 if(F.region&&(scope==='us'?s.region:s.country)!==F.region)return false;
 if(F.kind&&s.kind!==F.kind)return false;
 if(F.size&&s.size!==F.size)return false;
 if(F.tier&&!(r&&r.admission&&r.admission.current===F.tier))return false;
 if(F.synth.length&&!(r&&F.synth.every(k=>r.synthesizer[k]&&r.synthesizer[k].evidence==='verified')))return false;
 if(F.mark){const m=markOf(s.id);if(F.mark==='unmarked'?m:m!==F.mark)return false;}
 return true;
}

function loadSDK(){

async function switchMode(mode){

 if(mode==='standard'){if(vectorLayer){map.removeLayer(vectorLayer);vectorLayer=null;}if(!map.hasLayer(standardLayer))standardLayer.addTo(map);mapMode=mode;press();mapMsg('');return;}

 try{
  await loadSDK();if(req!==modeReq)return;
  cand=L.maptiler.maptilerLayer({apiKey:MAPTILER_KEY,style:mode==='chinese'?'https://api.maptiler.com/maps/streets-v4/style.json':'https://api.maptiler.com/maps/hybrid/style.json',language:mode==='chinese'?maptilersdk.Language.CHINESE:maptilersdk.Language.ENGLISH});
  await new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error('timeout')),20000);cand.once('ready',()=>{clearTimeout(t);res();});cand.addTo(map);cand.getMaptilerSDKMap().once('error',e=>{clearTimeout(t);rej(e.error||new Error('map'));});});
  if(req!==modeReq){map.removeLayer(cand);return;}
  if(vectorLayer)map.removeLayer(vectorLayer);if(map.hasLayer(standardLayer))map.removeLayer(standardLayer);
  vectorLayer=cand;mapMode=mode;press();mapMsg('');
 }catch(e){if(cand&&map.hasLayer(cand))map.removeLayer(cand);if(req===modeReq)mapMsg('这个地图暂时无法加载（本地预览时常见，网站上线后正常），已保留原地图。');}
}

 d.append(h('div',{class:'facts'},facts.map(f=>h('span',{text:f}))));
 const rk=[s.rankings.usnewsNU&&`U.S. News 全国大学 #${s.rankings.usnewsNU}`,s.rankings.usnewsLAC&&`U.S. News 文理学院 #${s.rankings.usnewsLAC}`,s.rankings.qs&&`QS #${s.rankings.qs}`].filter(Boolean);
 d.append(h('div',{class:'links'},s.officialUrl?h('a',{class:'btn',href:s.officialUrl,target:'_blank',rel:'noopener noreferrer',text:'官网 ↗'}):null,s.admissionsUrl?h('a',{class:'btn',href:s.admissionsUrl,target:'_blank',rel:'noopener noreferrer',text:'本科申请 ↗'}):null,
  h('a',{class:'btn',href:'https://www.youtube.com/results?search_query='+encodeURIComponent(s.name+' campus tour'),target:'_blank',rel:'noopener noreferrer',text:'校园参观视频 ↗'}),
  h('a',{class:'btn',href:'https://www.youtube.com/results?search_query='+encodeURIComponent(s.name+' day in the life student'),target:'_blank',rel:'noopener noreferrer',text:'学生的一天 ↗'}),
  compareBtn(id)));
 if(rk.length)d.append(h('p',{class:'hint',style:'margin:-6px 0 12px',text:'2027 榜单：'+rk.join(' · ')}));
 const head=r?(r.headline||firstSentence(r.value)):(s.howToStudy||'');
 const q=r?(r.headlineQuestion||r.miraQuestion):'';
 if(head||q)d.append(h('div',{class:'first'},head?h('p',{text:head}):null,q?h('p',{class:'q',text:'问问自己：'+q}):null));
 const c=s.climate||{};
 d.append(h('div',{class:'status-row'},
  h('div',{class:'status'},h('small',{text:'录取位置（现在 → 目标）'}),h('b',{text:r&&r.admission?`${r.admission.current} → ${r.admission.target}`:'待研究'})),
  h('div',{class:'status'},h('small',{text:'学校状态'}),h('b',{text:r&&r.health?LABEL.health[r.health.level]:'待研究'})),
  h('div',{class:'status'},h('small',{text:'冬天'}),h('b',{text:c.band?`${LABEL.band[c.band]} · 约 ${c.coldMonthMeanC}°C`:'待补'}))));
 if(!r){d.append(h('div',{class:'block'},h('h4',{text:'本科怎么学'}),s.howToStudy?h('p',{text:s.howToStudy}):h('p',null,todo('待补'))),h('p',{class:'hint',text:'这所学校还没有进入研究池，只有基础信息。'}),mineBox(id));return;}
 const tabs=[['value','值得看与注意'],['learn','怎么学'],['synth','综合者训练'],['paths','学习组合'],['adm','录取位置'],['life','校园与状态']];
 const bar=h('div',{class:'dtabs',role:'tablist'});const body=h('div');
 const show=k=>{detailTab=k;for(const b of bar.children)b.setAttribute('aria-selected',String(b.dataset.k===k));body.replaceChildren(...TAB[k](s,r));};
 for(const [k,t] of tabs){const b=h('button',{role:'tab','data-k':k,text:t});b.addEventListener('click',()=>show(k));bar.append(b);}
 d.append(bar,body);show(detailTab);
 d.append(mineBox(id));
}
const TAB={
 value:(s,r)=>[para('值得看的地方',r.value,'good'),para('需要注意的地方',r.tradeoff,'warn'),para('Mira 可以想一想',r.miraQuestion),para('以后能怎么走',r.career)],
 learn:(s,r)=>[
  para('学习路径（制度事实）',r.learningPath),
  h('div',{class:'block'},h('h4',{text:'可以先关注的专业'}),r.focusMajors.length?h('div',{class:'tags',style:'margin-bottom:8px'},r.focusMajors.map(m=>h('span',{class:'tag',text:m}))):null,r.majorNote?h('p',{text:r.majorNote}):h('p',null,todo())),
  para('转方向与跨学科组合的空间',r.flexibility)],
 synth:(s,r)=>{
  const out=[h('p',{class:'hint',style:'margin-top:0',text:'"综合者"：一门扎实的方法 + 跨领域连接。每一项只写查到的事实，并标明证据程度。'})];
  for(const k of Object.keys(LABEL.synth)){
   const it=r.synthesizer[k]||{evidence:'none'};
   out.push(h('div',{class:'block'},h('h4',null,LABEL.synth[k],h('span',{class:'ev '+it.evidence,text:LABEL.ev[it.evidence]})),
    it.text?h('p',{text:it.text}):h('p',null,todo('还没有查到具体证据。')),
    h('p',{class:'hint',style:'margin-top:4px',text:LABEL.synthHint[k]}),
    it.source?h('a',{class:'src',href:it.source,target:'_blank',rel:'noopener noreferrer',text:'来源 ↗'}):null));
  }
  if(r.synthesizer.summary)out.push(para('一句话',r.synthesizer.summary,'good'));
  return out;
 },
 paths:(s,r)=>{
  const out=[h('p',{class:'hint',style:'margin-top:0',text:'只是可能的组合，不代表现在需要决定。每条组合都要先在课程目录里核实。'})];
  if(!r.pathways.length)out.push(h('div',{class:'block'},h('p',null,todo('待研究：核实课程目录后补充 2–3 条组合。'))));
  for(const p of r.pathways)out.push(h('div',{class:'block'},h('h4',{text:p.title}),h('p',{text:p.parts.join(' ＋ ')}),p.source?h('a',{class:'src',href:p.source,target:'_blank',rel:'noopener noreferrer',text:'课程目录 ↗'}):null));
  return out;
 },
 adm:(s,r)=>{
  const a=r.admission||{};
  return [kv([
   [`现在（GPA ${profile.gpa} · SAT ${profile.sat} · TOEFL ${profile.toefl}）`,a.current],
   [`如果达到 SAT ${profile.satTarget} · TOEFL ${profile.toeflTarget}`,a.target],
   [`SAT ${profile.sat} 送不送`,a.sat1380],
   ['依据',a.basis],
   ['核实情况',a.verified?'已对照学校或官方数据':'ChatGPT 整理，待核实']]),
   h('p',{class:'hint',style:'margin-top:10px',text:'五档：远距离冲刺 / 冲刺 / 匹配偏冲 / 匹配 / 匹配偏稳。"匹配偏稳"不等于保底。成绩变化后需要重新判断。'})];
 },
 life:(s,r)=>{
  const L_=r.miraLens||{},e=r.experience||{},c=s.climate||{},hl=r.health||{};
  const pct=v=>v==null?null:v+'%';
  return [
   h('div',{class:'block'},h('h4',{text:'四个视角'}),kv([['起步支持',L_.start],['节奏与压力',L_.pace],['社交结构',L_.social],['与她主线的连接',L_.thread]])),
   h('div',{class:'block'},h('h4',{text:'数据'}),kv([['新生留存率',pct(e.retention)],['4 年 / 6 年毕业率',e.grad4!=null?`${e.grad4}% / ${e.grad6}%`:null],['师生比',e.studentFaculty],['兄弟会 / 姐妹会',e.fraternity!=null?`${e.fraternity}% / ${e.sorority}%`:null]]),e.note?h('p',{style:'margin-top:8px',text:e.note}):null),
   h('div',{class:'block'},h('h4',{text:'冬天'}),h('p',{text:c.band?`最冷月日平均约 ${c.coldMonthMeanC}°C（${LABEL.band[c.band]}，约数，待官方核实）。${c.note?c.note+'。':''}${c.outOfScope?'不在 Mira 的选校范围。':''}`:'待补'})),
   h('details',{class:'block'},h('summary',{style:'cursor:pointer;font-weight:600',text:`学校状态：${LABEL.health[hl.level]||'待研究'}`}),hl.note?h('p',{style:'margin-top:8px',text:hl.note}):null,hl.checked?h('p',{class:'hint',text:'核查日期：'+hl.checked}):null)];
 }
};
function mineBox(id){
 const cur=me.marks[id]||{};
 const box=h('div',{class:'mine-box'},h('h4',{text:'Mira 自己的判断'}));
 const chips=h('div',{class:'chips'});
 const status=h('small',{text:'只保存在这台设备的浏览器里，可在右上角"我的笔记"导出。'});
 for(const [k,t] of Object.entries(LABEL.mark)){
  const b=h('button',{class:'chip','aria-pressed':String(cur.mark===k),text:t});
  b.addEventListener('click',()=>{const on=markOf(id)!==k;setMark(id,{mark:on?k:''});for(const x of chips.children)x.setAttribute('aria-pressed','false');b.setAttribute('aria-pressed',String(on));status.textContent='已保存';});
  chips.append(b);
 }
 const mi=h('input',{type:'text',placeholder:'现在最想看的专业，例如 Economics + Data，或还没想好',value:cur.majorInterest||''});
 const note=h('textarea',{placeholder:'记录你的想法、感受或问题……'});note.value=cur.note||'';
 mi.addEventListener('input',()=>{status.textContent=setMark(id,{majorInterest:mi.value})?'已保存':'浏览器暂时无法保存';});
 note.addEventListener('input',()=>{status.textContent=setMark(id,{note:note.value})?'已保存':'浏览器暂时无法保存';});
 box.append(chips,mi,note,status);return box;
}

/* compare */
function renderCompare(){
 const root=$('view-compare');root.replaceChildren();
 root.append(h('h2',{style:'margin:0',text:'学校对比'}),h('p',{class:'hint',text:'选 2–3 所学校，把同一个问题放在一起看。这里不给总分，由你自己判断。'}));
 const pick=h('div',{class:'cmp-pick'});
 const opts=[...schools].sort((a,b)=>(R[a.id]?0:1)-(R[b.id]?0:1)||a.cnName.localeCompare(b.cnName,'zh'));
 for(let i=0;i<3;i++){
  const sel=h('select',{'aria-label':`学校 ${i+1}`});sel.append(new Option(i===2?'学校 3（可选）':`学校 ${i+1}`,''));
  for(const s of opts)sel.append(new Option(s.cnName,s.id,false,me.compare[i]===s.id));
  sel.addEventListener('change',()=>{const ids=[...pick.querySelectorAll('select')].map(x=>x.value).filter(Boolean);me.compare=[...new Set(ids)].slice(0,3);save();renderCompare();});
  pick.append(sel);
 }
 root.append(pick);
 const ids=me.compare.filter(id=>S[id]);
 if(ids.length<2){root.append(h('p',{class:'empty-note',text:'请至少选两所不同的学校。也可以在学校卡片或详情里点"加入对比"。'}));return;}
 const cell=(id,fn)=>{const s=S[id],r=R[id];const v=r?fn(s,r):null;return v==null||v===''?todo(r?'待研究':'未进入研究池'):v;};
 const ev=k=>(s,r)=>{const it=r.synthesizer[k];return it&&it.evidence!=='none'?`${LABEL.ev[it.evidence]}：${it.text}`:null;};
 const rows=[
  ['这所学校的特点',(s,r)=>r.headline||firstSentence(r.value)],
  ['转方向与组合空间',(s,r)=>r.flexibility],
  ['跨领域真实问题',ev('realProblems')],['跨领域资源',ev('crossResources')],['方法训练',ev('methods')],['表达训练',ev('expression')],
  ['起步支持',(s,r)=>r.miraLens.start],
  ['校园规模',s=>[LABEL.size[s.size],s.undergradEnrollment].filter(Boolean).join(' · ')],
  ['兄弟会 / 姐妹会',(s,r)=>r.experience.fraternity!=null?`${r.experience.fraternity}% / ${r.experience.sorority}%`:null],
  ['冬天',s=>s.climate?`${LABEL.band[s.climate.band]} · 约 ${s.climate.coldMonthMeanC}°C`:null],
  ['当前录取位置',(s,r)=>r.admission&&r.admission.current],
  [`SAT ${profile.satTarget} 后`,(s,r)=>r.admission&&r.admission.target],
  ['学校状态',(s,r)=>r.health&&LABEL.health[r.health.level]],
  ['全年总花费',s=>s.costOfAttendanceUSD?`约 $${s.costOfAttendanceUSD.toLocaleString()}`:null]
 ];
 root.append(h('div',{class:'cmp-wrap'},h('table',{class:'cmp'},
  h('thead',null,h('tr',null,h('th',null),ids.map(id=>h('th',null,h('a',{href:'#',text:S[id].cnName,onclick:e=>{e.preventDefault();openDrawer(id);}}))))),
  h('tbody',null,rows.map(([label,fn])=>h('tr',null,h('th',{text:label}),ids.map(id=>h('td',null,cell(id,fn)))))))));
}

/* notes export / import */
$('notes-btn').addEventListener('click',e=>{e.stopPropagation();const p=$('notes-pop');p.hidden=!p.hidden;$('notes-btn').setAttribute('aria-expanded',String(!p.hidden));});
document.addEventListener('click',e=>{if(!e.target.closest('.menu'))$('notes-pop').hidden=true;});
$('export-btn').addEventListener('click',()=>{
 const blob=new Blob([JSON.stringify({app:'mira-2027',version:3,exported:new Date().toISOString(),marks:me.marks,compare:me.compare},null,2)],{type:'application/json'});
 const a=h('a',{href:URL.createObjectURL(blob),download:`Mira选校笔记-${new Date().toISOString().slice(0,10)}.json`});document.body.append(a);a.click();a.remove();
});
$('import-file').addEventListener('change',async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  const d=JSON.parse(await f.text());
  if(!d||d.app!=='mira-2027'||typeof d.marks!=='object')throw new Error('bad');
  for(const [id,v] of Object.entries(d.marks)){const cur=me.marks[id];if(!cur||String(v.updated||'')>String(cur.updated||''))me.marks[id]=v;}
  if(Array.isArray(d.compare)&&!me.compare.length)me.compare=d.compare.slice(0,3);
  save();alert('已导入笔记。');go(view);
 }catch(_){alert('这个文件不是 Mira 选校笔记，无法导入。');}
 e.target.value='';$('notes-pop').hidden=true;
});

window.addEventListener('resize',()=>{if(map)map.invalidateSize();if(mineMap)mineMap.invalidateSize();});
const start=(location.hash||'').slice(1);
go(['mine','us','global','compare'].includes(start)?start:'mine');
</script>
