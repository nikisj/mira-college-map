<header><div class="heading"><div><h1>Mira<span>｜2027 美本选校</span></h1><p class="subtitle" id="subtitle"></p></div><button class="reset" id="reset" type="button">显示全部</button></div><p class="question">如果完全不考虑录取难度，我愿不愿意在这里生活、学习、交朋友、成长四年？</p></header>
<main><aside class="sidebar" aria-label="学校列表"><div class="controls"><input id="search" type="search" placeholder="搜索学校、城市或州" aria-label="搜索学校" autocomplete="off"><div id="type-filter" class="segments" role="group" aria-label="学校类型筛选"></div><p class="count" id="result-count" aria-live="polite"></p></div><div class="school-list" id="school-list"></div></aside><section class="map-panel" aria-label="美国选校地图"><div id="map" aria-label="学校位置交互地图"></div><div class="legend" id="legend" aria-label="学校类型图例"></div></section><aside id="details" class="details" aria-label="学校详情" tabindex="-1"><button id="sheet-close" class="sheet-close" type="button" aria-label="关闭学校详情">×</button><div id="detail-content"></div></aside></main>

{ name:"University of Wisconsin–Madison", cnName:"威斯康星大学麦迪逊分校", city:"Madison", state:"Wisconsin", type:"D", lat:43.0766, lng:-89.4125, value:"", tradeoff:"", miraQuestion:"", miraChoice:"", note:"" },

{ name:"George Washington University", cnName:"乔治华盛顿大学", city:"Washington", state:"District of Columbia", type:"E", lat:38.8997, lng:-77.0486, value:"", tradeoff:"", miraQuestion:"", miraChoice:"", note:"" }

];
const schoolTypes = {
 A: {label:'关系密集型本科环境', en:'Relationship-intensive undergraduate', color:'#708b80'},
 B: {label:'导师＋研究探索型', en:'Advising & research exploration', color:'#788da1'},
 C: {label:'项目／职业探索型', en:'Project & career-oriented', color:'#a38f6d'},
 D: {label:'大型研究／旗舰大学', en:'Large research / flagship', color:'#91849e'},
 E: {label:'城市嵌入型', en:'Urban-embedded', color:'#ac8581'}
};
const byId = id => document.getElementById(id);
const typeKeys = [...new Set(schools.map(s => s.type))].sort();
const typeInfo = key => schoolTypes[key] || {label:key,en:'',color:'#6b7b72'};
let activeType = '';
byId('subtitle').textContent = `当前阶段性研究池 · ${schools.length}所`;
for (const key of ['', ...typeKeys]) {
 const info=typeInfo(key), button=textElement('button','',key || '全部');
 button.type='button';button.dataset.type=key;
 button.title=key ? `${key}｜${info.label}` : '全部学校类型';
 button.setAttribute('aria-label',button.title);button.setAttribute('aria-pressed',String(!key));
 button.addEventListener('click',()=>{activeType=key;render();});
 byId('type-filter').append(button);
 if (!key) continue;
 const item=textElement('span','legend-item','');
 const dot=textElement('span','dot','');dot.style.background=info.color;
 item.append(dot,document.createTextNode(`${key} ${info.label}`));byId('legend').append(item);
}
// 判断和备注只保存在本浏览器；学校的研究内容仍由 schools 管理。
const storageKey='mira-2027-college-preferences-v2';
let preferences={};
try { const saved=JSON.parse(localStorage.getItem(storageKey) || '{}');
 if (saved && typeof saved==='object' && !Array.isArray(saved)) preferences=saved;
} catch (_) { /* 存储不可用时仍可在本次页面会话中使用。 */ }
const mobile=window.matchMedia('(max-width:900px)');
let returnFocus=null;
function updatePreference(school, field, value) {
 const key=school.name;
 preferences[key]={...preferences[key], [field]:value};
 try {localStorage.setItem(storageKey,JSON.stringify(preferences));byId('save-status').textContent='已保存在此浏览器';}
 catch (_) {byId('save-status').textContent='本次已记录；浏览器暂不支持保存';}
}
function detailView() {
 const root=byId('detail-content');root.replaceChildren();
 if (selectedIndex===null) {
  const empty=textElement('div','detail-empty','');
  empty.append(textElement('h2','','选择一所学校'),textElement('p','','点击地图或左侧学校名称查看详情。'));
  root.append(empty);return;
 }
 const school=schools[selectedIndex],info=typeInfo(school.type);
 const saved=preferences[school.name] || {};
 const title=textElement('h2','detail-name',school.cnName);title.id='detail-title';
 root.append(title,textElement('p','detail-en',school.name),textElement('p','detail-place',`${school.city}, ${school.state}`));
 const badge=textElement('div','type-label',`${school.type}｜${info.label}`);badge.style.color=info.color;
 root.append(badge,textElement('p','type-en',info.en));
 [['value','为什么值得继续看'],['tradeoff','主要交换成本'],['miraQuestion','Mira 要回答的问题']].forEach(([field,label],i)=>{
  const section=textElement('section','research-block',''),heading=textElement('h3','','');
  heading.append(textElement('span','',String(i+1).padStart(2,'0')),document.createTextNode(label));
  const value=typeof school[field]==='string' ? school[field].trim() : '';
  section.append(heading,textElement('p',value?'':'placeholder',value || '待补充'));root.append(section);
 });
 const judgment=textElement('section','judgment','');judgment.append(textElement('h3','','Mira的感觉'));
 const choices=textElement('div','segments choice-segments','');choices.setAttribute('role','group');choices.setAttribute('aria-label','Mira的感觉');
 for (const label of ['很想继续了解','需要更多了解','暂时无感']) {
  const button=textElement('button','',label);button.type='button';
  button.setAttribute('aria-pressed',String((saved.miraChoice ?? school.miraChoice)===label));
  button.addEventListener('click',()=>{for(const item of choices.children)item.setAttribute('aria-pressed',String(item===button));updatePreference(school,'miraChoice',label);});
  choices.append(button);
 }
 const label=textElement('label','note-label','一句话备注');label.htmlFor='school-note';
 const note=document.createElement('textarea');note.id='school-note';note.rows=2;note.placeholder='写下一点感受…';
 note.value=typeof saved.note==='string'?saved.note:school.note || '';
 note.addEventListener('input',()=>updatePreference(school,'note',note.value));
 const status=textElement('p','save-status','仅保存在此浏览器');status.id='save-status';status.setAttribute('aria-live','polite');
 judgment.append(choices,label,note,status);root.append(judgment);
}
function openSheet() {
 if(!mobile.matches)return;
 returnFocus=document.activeElement;
 byId('details').classList.add('open');byId('backdrop').classList.add('open');document.body.classList.add('sheet-open');
 byId('details').setAttribute('role','dialog');byId('details').setAttribute('aria-modal','true');
 document.querySelector('header').inert=true;byId('school-list').closest('.sidebar').inert=true;byId('map').closest('.map-panel').inert=true;
 byId('details').scrollTop=0;byId('sheet-close').focus({preventScroll:true});
}
function closeSheet() {
 byId('details').classList.remove('open');byId('backdrop').classList.remove('open');document.body.classList.remove('sheet-open');
 byId('details').removeAttribute('role');byId('details').removeAttribute('aria-modal');
 document.querySelector('header').inert=false;byId('school-list').closest('.sidebar').inert=false;byId('map').closest('.map-panel').inert=false;
 if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});returnFocus=null;
}
byId('sheet-close').addEventListener('click',closeSheet);byId('backdrop').addEventListener('click',closeSheet);
mobile.addEventListener('change',()=>{closeSheet();if(map)map.invalidateSize({pan:false});});
document.addEventListener('keydown',event=>{
 if(!mobile.matches || !byId('details').classList.contains('open'))return;
 if(event.key==='Escape'){event.preventDefault();closeSheet();}
 if(event.key==='Tab'){
  const nodes=[...byId('details').querySelectorAll('button,textarea')],first=nodes[0],last=nodes[nodes.length-1];
  if(event.shiftKey && document.activeElement===first){event.preventDefault();last.focus();}
  else if(!event.shiftKey && document.activeElement===last){event.preventDefault();first.focus();}
 }
});
let map = null, markerLayer = null, selectedIndex = null;
const markers = new Map();
let pendingPopup = null;
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (window.L) {
 map = L.map('map', {scrollWheelZoom:true}).setView([39,-96],4);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
 }).addTo(map);
 markerLayer = L.layerGroup().addTo(map);
 new ResizeObserver(() => map.invalidateSize({pan:false})).observe(byId('map'));
} else {
 byId('map').className='map-error';
 byId('map').textContent='地图未能加载。请连接网络后刷新页面，以加载地图组件与底图。学校列表和筛选仍可使用。';
}
function textElement(tag, className, text) {
 const element = document.createElement(tag); element.className=className; element.textContent=text; return element;
}
function makePopup(school) {
 const info=typeInfo(school.type), popup=document.createElement('div');
 popup.append(textElement('div','popup-cn',school.cnName),textElement('div','popup-en',school.name),textElement('div','popup-place',`${school.city}, ${school.state}`));
 const type=textElement('div','popup-type',`${school.type}｜${info.label}`); type.style.color=info.color;
 type.append(textElement('small','',info.en)); popup.append(type); return popup;
}
function highlight(index, scroll) {
 selectedIndex=index;
 for (const button of byId('school-list').querySelectorAll('.school')) {
  const active=Number(button.dataset.index)===index;
  button.classList.toggle('selected',active); button.setAttribute('aria-pressed',String(active));
  if (active && scroll) {
   const list=byId('school-list');
   list.scrollTo({top:list.scrollTop+button.getBoundingClientRect().top-list.getBoundingClientRect().top-(list.clientHeight-button.offsetHeight)/2,behavior:reducedMotion?'instant':'smooth'});
  }
 }
}
function selectSchool(index) {
 highlight(index,false);
 detailView();openSheet();
 if (!map) return;
 const marker=markers.get(index); if (!marker) return;
 if (pendingPopup) { map.off('moveend',pendingPopup); pendingPopup=null; }
 map.stop();

 pendingPopup = () => { marker.openPopup(); pendingPopup=null; };
 map.once('moveend',pendingPopup);
 map.flyTo(marker.getLatLng(),11,{animate:!reducedMotion,duration:.85});
}
function render() {
 const query=byId('search').value.trim().toLocaleLowerCase();
 const type=activeType;
 for(const button of byId('type-filter').children)button.setAttribute('aria-pressed',String(button.dataset.type===type));
 const visible=schools.map((school,index)=>({school,index})).filter(({school:s})=>(!type||s.type===type)&&(!query||[s.cnName,s.name,s.city,s.state].some(value=>value.toLocaleLowerCase().includes(query))));
 if(map){if(pendingPopup){map.off('moveend',pendingPopup);pendingPopup=null;}map.stop();map.closePopup();markerLayer.clearLayers();} markers.clear();
 if (!visible.some(item=>item.index===selectedIndex)) selectedIndex=null;
 byId('school-list').replaceChildren();
 byId('result-count').textContent=`显示 ${visible.length} / ${schools.length} 所学校`;
 for (const {school:s,index} of visible) {
  const info=typeInfo(s.type), button=document.createElement('button');
  button.type='button';button.className='school';button.dataset.index=index;button.style.setProperty('--type-color',info.color);
  const dot=document.createElement('span');dot.className='dot';dot.style.background=info.color;
  button.append(dot,textElement('strong','',s.cnName),textElement('span','english',s.name),textElement('span','place',`${s.city}, ${s.state}`));
  button.addEventListener('click',()=>selectSchool(index));byId('school-list').append(button);
  if (map) {
   const pin=document.createElement('div');pin.className='pin';pin.style.background=info.color;pin.append(textElement('span','',s.type));
   const marker=L.marker([s.lat,s.lng],{title:s.cnName,alt:s.cnName,icon:L.divIcon({className:'pin-wrap',html:pin,iconSize:[28,36],iconAnchor:[13,32],popupAnchor:[0,-31]})}).bindPopup(makePopup(s),{maxWidth:280}).addTo(markerLayer);
   marker.on('click',()=>{if(pendingPopup){map.off('moveend',pendingPopup);pendingPopup=null;}map.stop();highlight(index,true);detailView();openSheet();}); markers.set(index,marker);
  }
 }
 highlight(selectedIndex,false);
 detailView();
 if (!visible.length) byId('school-list').append(textElement('p','empty','没有匹配的学校。试试其他关键词，或点击“显示全部”。'));
 if (map && visible.length) map.fitBounds(visible.map(({school:s})=>[s.lat,s.lng]),{padding:[45,45],maxZoom:10,animate:false});
}
byId('search').addEventListener('input',render);
byId('reset').addEventListener('click',()=>{byId('search').value='';activeType='';selectedIndex=null;render();byId('school-list').scrollTop=0;});
render();
</script>
</body>
</html>
